<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1280">
  
  <defs id="kit-defs" data-name="Kit defs">
    <linearGradient id="ear-highlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EBC095"/>
      <stop offset="1" stop-color="#DE945F"/>
    </linearGradient>
  </defs>
  <rect id="kit-desk" data-name="Background" data-icon-layer="background" x="0" y="0" width="1280" height="1280" fill="#F3EFE7"/>

  <g id="all" transform="translate(640 650) scale(0.86) translate(-610 -640)">
  <!-- Faceted head: the family silhouette (from NeedleBub), outline closed. -->
  <g id="part-head-faceted" data-name="Faceted head" data-part="head/faceted">
    <path id="head-shell" data-name="Warm ivory face" d="M284.4444 414.8148L414.8148 272.5926H450.3704L580.7407 402.963L711.1111 272.5926H746.6667L877.037 414.8148V675.5556L758.5185 865.1852H379.2593L284.4444 770.3704Z" fill="#FFFAF1"/>
    <path id="head-facet" data-name="Quiet lower facet" d="M284.4444 699.2593L391.1111 794.0741H805.9259L758.5185 865.1852H379.2593L284.4444 770.3704Z" fill="#E4DCCF"/>
    <path id="head-outline" data-name="Outline" d="M877.037 675.5556V414.8148L746.6667 272.5926H711.1111L580.7407 402.963L450.3704 272.5926H414.8148L284.4444 414.8148V770.3704L379.2593 865.1852H758.5185Z" fill="none" stroke="#282A2F" stroke-width="54.52" stroke-linecap="butt" stroke-linejoin="bevel"/>
  </g>

  <!-- Calico ears: charcoal left, apricot right (NeedleBub). -->
  <g id="part-ears-calico" data-name="Calico ears" data-part="ears/calico">
    <g id="ear-left-group" data-name="Left ear">
      <path id="ear-left" data-name="Charcoal ear patch" d="M322.9444 436.3148L414.8148 272.5926L450.3704 272.5926L549.7407 394.963L515.98 397.37L460.8704 403.8148L385.4074 419.8704Z" fill="#282A2F" stroke="#282A2F" stroke-width="54.52" stroke-linejoin="miter"/>
      <path id="ear-inset-left" data-name="Left ivory ear inset" d="M346.3333 401L426.5926 311.3704L494.2222 384L455.54 381.03L406.04 385.41Z" fill="#FFFAF1"/>
    </g>
    <g id="ear-right-group" data-name="Right ear">
      <path id="ear-right" data-name="Apricot ear patch" d="M877.037 414.8148L746.6667 272.5926L711.1111 272.5926L602.7407 415.963L702.1111 428.8148L796.13 430.99L859.0741 446.3704Z" fill="url(#ear-highlight)"/>
      <path id="ear-inset-right" data-name="Right ivory ear inset" transform="matrix(1 0 0 1 0 4)" d="M808.1481 400L728.8889 322.3704L657.2593 392L709.39 404.05L782.39 406.14Z" fill="#FFFAF1"/>
    </g>
  </g>

  <!-- Happy face: ^ ^ eyes, soft nose, double smile, rosy cheeks. -->
  <g id="part-face-happy" data-name="Happy face" data-part="face/happy">
    <g id="eyes" data-name="Happy eyes">
      <path id="eye-left" data-name="Left happy eye" d="M391.1111 568.8889L444.4444 515.5556H462.2222L515.5556 568.8889" fill="none" stroke="#282A2F" stroke-width="41.48" stroke-linecap="round" stroke-linejoin="bevel"/>
      <path id="eye-right" data-name="Right happy eye" d="M645.9259 568.8889L699.2593 515.5556H717.037L770.3704 568.8889" fill="none" stroke="#282A2F" stroke-width="41.48" stroke-linecap="round" stroke-linejoin="bevel"/>
    </g>
    <g id="mouth" data-name="Nose and smile">
      <path id="nose" data-name="Soft triangular nose" d="M564.1481 616.2963H597.3333Q605.6296 616.2963 599.7037 622.8148L586.6667 635.2593Q580.7407 640.5926 574.8148 635.2593L561.7778 622.8148Q555.8519 616.2963 564.1481 616.2963Z" fill="#DE945F"/>
      <path id="smile" data-name="Centered double smile" d="M503.7037 651.8519C503.7037 740.7407 580.7407 740.7407 580.7407 657.7778C580.7407 740.7407 657.7778 740.7407 657.7778 651.8519" fill="none" stroke="#282A2F" stroke-width="37.93" stroke-linecap="round"/>
    </g>
    <g id="cheeks" data-name="Rosy cheeks">
      <path id="cheek-left" data-name="Left rosy cheek" d="M367.4074 640L402.963 648.2963" fill="none" stroke="#DDA39D" stroke-width="26.07" stroke-linecap="round"/>
      <path id="cheek-right" data-name="Right rosy cheek" d="M758.5185 648.2963L794.0741 640" fill="none" stroke="#DDA39D" stroke-width="26.07" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Notebook: spiral rings through the left edge of the head. -->
  <g id="part-notebook-rings" data-name="Spiral rings" data-part="notebook/rings">
    <g id="ring-1" data-name="Ring 1">
      <rect id="ring-1-loop" data-name="Loop" x="226" y="452" width="118" height="46" rx="23" fill="#282A2F"/>
      <circle id="ring-1-hole" data-name="Hole" cx="320" cy="475" r="9" fill="#FFFAF1"/>
    </g>
    <g id="ring-2" data-name="Ring 2">
      <rect id="ring-2-loop" data-name="Loop" x="226" y="542" width="118" height="46" rx="23" fill="#282A2F"/>
      <circle id="ring-2-hole" data-name="Hole" cx="320" cy="565" r="9" fill="#FFFAF1"/>
    </g>
    <g id="ring-3" data-name="Ring 3">
      <rect id="ring-3-loop" data-name="Loop" x="226" y="632" width="118" height="46" rx="23" fill="#282A2F"/>
      <circle id="ring-3-hole" data-name="Hole" cx="320" cy="655" r="9" fill="#FFFAF1"/>
    </g>
  </g>

  <!-- Notebook: page edges along the lower facet. -->
  <g id="part-notebook-pages" data-name="Page edges" data-part="notebook/pages">
    <path id="page-line-1" data-name="Page line 1" d="M402 818H788" fill="none" stroke="#D3C8B6" stroke-width="10" stroke-linecap="round"/>
    <path id="page-line-2" data-name="Page line 2" d="M420 840H772" fill="none" stroke="#D3C8B6" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Notebook: a pencil where NeedleBub holds its needle, tip down-left. -->
  <g id="part-object-pencil" data-name="Pencil" data-part="object/pencil" transform="translate(690 1000) rotate(-54)">
    <path id="pencil-wood" data-name="Wood tip" d="M0 0L104 -38V38Z" fill="#FFFAF1" stroke="#282A2F" stroke-width="24" stroke-linejoin="round"/>
    <path id="pencil-lead" data-name="Lead" d="M0 0L36 -13V13Z" fill="#282A2F" stroke="#282A2F" stroke-width="10" stroke-linejoin="round"/>
    <rect id="pencil-body" data-name="Body" x="104" y="-38" width="260" height="76" fill="#DE945F" stroke="#282A2F" stroke-width="24" stroke-linejoin="round"/>
    <path id="pencil-shine" data-name="Shine" d="M124 -12H344" fill="none" stroke="#EBC095" stroke-width="12" stroke-linecap="round"/>
    <rect id="pencil-ferrule" data-name="Ferrule" x="364" y="-38" width="34" height="76" fill="#282A2F" stroke="#282A2F" stroke-width="24" stroke-linejoin="round"/>
    <rect id="pencil-eraser" data-name="Eraser" x="398" y="-38" width="56" height="76" rx="18" fill="#DDA39D" stroke="#282A2F" stroke-width="24" stroke-linejoin="round"/>
  </g>
</g>
</svg>
