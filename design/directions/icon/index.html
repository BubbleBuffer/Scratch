<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes icon concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Atkinson+Hyperlegible+Next:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --desk: #ECE6DB; --paper: #FFFAF1; --ink: #282A2F; --muted: #6B6A66;
    --apricot: #DE945F; --paw: #DDA39D; --duvet: #2F3138; --line: #D9D1C3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--desk); color: var(--ink);
    font: 15px/1.5 "Atkinson Hyperlegible Next", system-ui, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font: 700 34px/1.1 "Bricolage Grotesque", sans-serif; margin: 0 0 6px; }
  h2 { font: 700 22px/1.2 "Bricolage Grotesque", sans-serif; margin: 0; }
  p.lead { color: var(--muted); margin: 0 0 28px; max-width: 64ch; }
  .card { background: var(--paper); border: 1px solid var(--line);
    border-radius: 12px 18px 10px 16px; padding: 20px; margin-bottom: 20px;
    box-shadow: 0 2px 0 rgba(40,42,47,.06); }
  .head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }
  .tag { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px;
    background: #F4E3D5; color: #7A4A28; }
  .note { color: var(--muted); margin: 0 0 16px; max-width: 70ch; }
  .row { display: flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted); }
  .sq { border-radius: 26%; overflow: hidden; display: block; }
  .ci { border-radius: 50%; overflow: hidden; display: block; }
  .phone { display: flex; gap: 22px; padding: 18px 22px; border-radius: 14px;
    background: linear-gradient(160deg, #3d4a5c, #1f242c); }
  .phone.light { background: linear-gradient(160deg, #e9eef3, #cbd5df); }
  .phone .cell { color: #e8e8e8; }
  .phone.light .cell { color: #333; }
  svg { display: block; }
</style>
</head>
<body>
<main>
  <h1>Notes icon</h1>
  <p class="lead">A notebook with cat ears, a cat face and calico patches. Three takes, each shown as the large Android icon (squircle and circle masks), at launcher size on a dark and a light wallpaper, and at 24 px.</p>

  <!-- Shared artwork. Each concept draws in a 108 x 108 adaptive-icon grid; the
       66 px safe circle in the middle is what every launcher mask keeps. -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <!-- A: cream notebook with ears, spiral binding, calico patches -->
      <clipPath id="a-body"><path d="M37,44 L38.5,27 Q39,24 41.5,25.5 L50,33 L58,33 L66.5,25.5 Q69,24 69.5,27 L71,44 L71,76 Q71,81 66,81 L42,81 Q37,81 37,76 Z"/></clipPath>
      <symbol id="icon-a" viewBox="0 0 108 108">
        <rect width="108" height="108" fill="#2F3138"/>
        <g transform="translate(54 54) scale(1.14) translate(-54 -53)">
        <path d="M37,44 L38.5,27 Q39,24 41.5,25.5 L50,33 L58,33 L66.5,25.5 Q69,24 69.5,27 L71,44 L71,76 Q71,81 66,81 L42,81 Q37,81 37,76 Z" fill="#000" transform="translate(1.6 2.2)" opacity=".35"/>
        <path d="M37,44 L38.5,27 Q39,24 41.5,25.5 L50,33 L58,33 L66.5,25.5 Q69,24 69.5,27 L71,44 L71,76 Q71,81 66,81 L42,81 Q37,81 37,76 Z" fill="none" stroke="#ECE6DB" stroke-width="5.5" stroke-linejoin="round"/>
        <g clip-path="url(#a-body)">
          <rect x="30" y="20" width="50" height="66" fill="#FFFAF1"/>
          <!-- calico: apricot over the left ear, ink over the right -->
          <path d="M30,20 L52,20 Q54,30 47,36 Q40,41 30,38 Z" fill="#DE945F"/>
          <path d="M60,20 L80,20 L80,44 Q72,45 67,40 Q61,34 60,20 Z" fill="#282A2F"/>
          <!-- ruled lines on the lower cover -->
          <path d="M44,68 H66 M44,73 H62" stroke="#E4D9C7" stroke-width="1.6" stroke-linecap="round"/>
          <!-- spine -->
          <rect x="30" y="20" width="10" height="66" fill="#2F3138" opacity=".10"/>
        </g>
        <path d="M37,44 L38.5,27 Q39,24 41.5,25.5 L50,33 L58,33 L66.5,25.5 Q69,24 69.5,27 L71,44 L71,76 Q71,81 66,81 L42,81 Q37,81 37,76 Z" fill="none" stroke="#282A2F" stroke-width="2.2" stroke-linejoin="round"/>
        <!-- spiral rings -->
        <g fill="none" stroke="#ECE6DB" stroke-width="2.2" stroke-linecap="round">
          <path d="M34,47 Q34,44.5 37,44.5 Q40,44.5 40,47"/>
          <path d="M34,55 Q34,52.5 37,52.5 Q40,52.5 40,55"/>
          <path d="M34,63 Q34,60.5 37,60.5 Q40,60.5 40,63"/>
          <path d="M34,71 Q34,68.5 37,68.5 Q40,68.5 40,71"/>
        </g>
        <!-- face: sleepy-happy eyes, paw nose, w mouth -->
        <g fill="none" stroke="#282A2F" stroke-width="2.1" stroke-linecap="round">
          <path d="M47,50 Q49.5,53 52,50"/>
          <path d="M57,50 Q59.5,53 62,50"/>
          <path d="M52.6,58.6 Q54.5,61 56.4,58.6 M56.4,58.6 Q54.5,61 52.6,58.6" stroke-width="1.6"/>
        </g>
        <path d="M52.8,55.2 H56.2 L54.5,57.4 Z" fill="#DDA39D" stroke="#DDA39D" stroke-width="1.2" stroke-linejoin="round"/>
        <g stroke="#282A2F" stroke-width="1.3" stroke-linecap="round" opacity=".55">
          <path d="M45,57 L49,57.6 M45,60.4 L49,59.6 M64,57 L60,57.6 M64,60.4 L60,59.6"/>
        </g>
        </g>
      </symbol>

      <!-- B: apricot notebook, cat face as the cover label, ribbon tail -->
      <clipPath id="b-body"><path d="M36,43 L37,26 Q37.5,23 40,24.6 L49,32 L59,32 L68,24.6 Q70.5,23 71,26 L72,43 L72,76 Q72,81 67,81 L41,81 Q36,81 36,76 Z"/></clipPath>
      <symbol id="icon-b" viewBox="0 0 108 108">
        <rect width="108" height="108" fill="#ECE6DB"/>
        <g transform="translate(54 54) scale(1.12) translate(-54 -55)">
        <!-- ribbon bookmark that curls like a tail -->
        <path d="M63,79 Q63,88 70,88 Q76,88 76,82" fill="none" stroke="#DDA39D" stroke-width="4" stroke-linecap="round"/>
        <g clip-path="url(#b-body)">
          <rect x="30" y="20" width="50" height="66" fill="#DE945F"/>
          <!-- calico: ink patch over the right ear, cream over the left eye -->
          <path d="M58,20 L80,20 L80,46 Q70,47 65,40 Q60,33 58,20 Z" fill="#282A2F"/>
          <path d="M30,20 L47,20 Q49,30 43,35 Q37,39 30,37 Z" fill="#FFFAF1"/>
          <!-- page block along the bottom edge -->
          <rect x="30" y="76" width="50" height="10" fill="#FFFAF1"/>
          <path d="M30,78.5 H80" stroke="#E4D9C7" stroke-width="1"/>
          <!-- spine band -->
          <rect x="30" y="20" width="9" height="66" fill="#282A2F" opacity=".16"/>
        </g>
        <path d="M36,43 L37,26 Q37.5,23 40,24.6 L49,32 L59,32 L68,24.6 Q70.5,23 71,26 L72,43 L72,76 Q72,81 67,81 L41,81 Q36,81 36,76 Z" fill="none" stroke="#282A2F" stroke-width="2.2" stroke-linejoin="round"/>
        <!-- cream face label -->
        <rect x="44" y="45" width="22" height="20" rx="6" ry="7" fill="#FFFAF1"/>
        <g fill="#282A2F">
          <ellipse cx="50" cy="52.5" rx="1.9" ry="2.4"/>
          <ellipse cx="60" cy="52.5" rx="1.9" ry="2.4"/>
        </g>
        <path d="M53.4,56 H56.6 L55,58 Z" fill="#DDA39D" stroke="#DDA39D" stroke-width="1.1" stroke-linejoin="round"/>
        <path d="M52.6,59.4 Q53.8,61.2 55,59.4 Q56.2,61.2 57.4,59.4" fill="none" stroke="#282A2F" stroke-width="1.5" stroke-linecap="round"/>
        </g>
      </symbol>

      <!-- C: open notebook seen from above, ears on the outer corners -->
      <symbol id="icon-c" viewBox="0 0 108 108">
        <rect width="108" height="108" fill="#DE945F"/>
        <g transform="translate(54 54) scale(1.08) translate(-54 -52)">
        <!-- cover peeking under the pages -->
        <path d="M24,44 L27,27 L40,35 Q54,30 68,35 L81,27 L84,44 L84,73 Q70,70 54,76 Q38,70 24,73 Z" fill="#282A2F"/>
        <!-- left page (apricot patch corner) and right page -->
        <clipPath id="c-left"><path d="M27,44 L29.5,30 L41,37.5 Q48,35.5 54,38 L54,72 Q41,67 27,70 Z"/></clipPath>
        <clipPath id="c-right"><path d="M81,44 L78.5,30 L67,37.5 Q60,35.5 54,38 L54,72 Q67,67 81,70 Z"/></clipPath>
        <g clip-path="url(#c-left)">
          <rect x="20" y="25" width="40" height="55" fill="#FFFAF1"/>
          <path d="M20,25 L44,25 Q44,38 36,42 Q28,46 20,44 Z" fill="#DE945F"/>
          <path d="M33,58 Q42,56 50,58.5 M33,63 Q41,61 49,63.5" stroke="#E4D9C7" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </g>
        <g clip-path="url(#c-right)">
          <rect x="48" y="25" width="40" height="55" fill="#FFFAF1"/>
          <path d="M88,25 L66,25 Q67,37 73,41 Q80,45 88,43 Z" fill="#DDA39D"/>
          <path d="M58,58.5 Q66,56 75,58 M59,63.5 Q67,61 75,63" stroke="#E4D9C7" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </g>
        <path d="M27,44 L29.5,30 L41,37.5 Q48,35.5 54,38 Q60,35.5 67,37.5 L78.5,30 L81,44 L81,70 Q67,67 54,72 Q41,67 27,70 Z" fill="none" stroke="#282A2F" stroke-width="2" stroke-linejoin="round"/>
        <path d="M54,38 V72" stroke="#282A2F" stroke-width="1.6"/>
        <!-- face across the spine -->
        <g fill="none" stroke="#282A2F" stroke-width="2" stroke-linecap="round">
          <path d="M43,47 Q45.5,50 48,47"/>
          <path d="M60,47 Q62.5,50 65,47"/>
        </g>
        <path d="M52.3,51.4 H55.7 L54,53.6 Z" fill="#DE945F" stroke="#DE945F" stroke-width="1.1" stroke-linejoin="round"/>
        </g>
      </symbol>
    </defs>
  </svg>

  <div id="concepts"></div>
</main>
<script>
  const concepts = [
    { id: 'a', name: 'A · Spiral cat', tag: 'closest to the brief',
      note: 'A cream notebook whose top edge grows two ears, spiral rings down the spine, calico patches (apricot and ink) over the ears, a sleepy-happy face like the sleeping cat in the app. Dark duvet background, like the app rail.' },
    { id: 'b', name: 'B · Label cat', tag: 'bolder at small sizes',
      note: 'An apricot notebook with a cream face label, ink and cream calico patches, a page block along the bottom and a paw-pink ribbon bookmark curling out like a tail. Warm desk background.' },
    { id: 'c', name: 'C · Open book cat', tag: 'most "notes"',
      note: 'An open notebook seen from above; the top corners of the pages are the ears, the face sits across the spine, with apricot and paw-pink patches on each page. Apricot background.' },
  ];
  const use = (id, size, cls) =>
    `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 108 108"><use href="#icon-${id}"/></svg>`;
  const big = location.hash === '#big';
  document.getElementById('concepts').innerHTML = big ? concepts.map(c => `<div class="cell" style="display:inline-flex;margin:8px">${use(c.id, 360, 'sq')}${c.name}</div>`).join('') : concepts.map(c => `
    <section class="card">
      <div class="head"><h2>${c.name}</h2><span class="tag">${c.tag}</span></div>
      <p class="note">${c.note}</p>
      <div class="row">
        <div class="cell">${use(c.id, 192, 'sq')}Squircle</div>
        <div class="cell">${use(c.id, 192, 'ci')}Circle</div>
        <div class="phone">
          <div class="cell">${use(c.id, 56, 'ci')}Notes</div>
          <div class="cell">${use(c.id, 56, 'sq')}Notes</div>
        </div>
        <div class="phone light">
          <div class="cell">${use(c.id, 56, 'ci')}Notes</div>
        </div>
        <div class="cell">${use(c.id, 24, 'sq')}24 px</div>
      </div>
    </section>`).join('');
</script>
</body>
</html>
