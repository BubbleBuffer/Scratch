# CI for the public Scratch repository, on GitHub-hosted runners.
#
# Runs on pushes to main, on pull requests (forks included: hosted runners
# only, read-only token, no secrets) and on demand. Mirrors the private
# repository's test gate: Rust format, lints and the workspace tests, then
# Flutter analyze, the add-on import check, the generated-bindings check and
# the fast Flutter test tier.
#
# Skipped on purpose:
#   - notes-tauri (prototypes/tauri): a bake-off prototype that needs the GTK
#     and WebKitGTK dev packages; the private gate excludes it too.
#   - Flutter goldens: their baselines are rendered on Windows.
#   - rustfmt is report-only and clippy warnings do not fail the job (see
#     the rust job).
#   - Flutter perf (timing budgets) and drive (a long-lived session host)
#     tags: not part of the fast tier.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
      # Report-only for now: the tree is not rustfmt-clean yet (the private
      # gate does not check formatting). Drop continue-on-error once it is.
      - name: cargo fmt --check (report only)
        continue-on-error: true
        run: cargo fmt --all --check
      # Lints are reported as warnings, not denied: the private gate has no
      # clippy step and the tree has open clippy warnings.
      - name: cargo clippy
        run: cargo clippy --workspace --exclude notes-tauri --all-targets --locked
      - name: cargo test --workspace
        run: cargo test --workspace --locked --exclude notes-tauri --no-fail-fast

  flutter:
    name: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: scratch
          persist-credentials: false
      # The agent tests run BubblePaw's fake extension. Build it from the
      # BubblePaw-Core commit that Cargo.lock pins for the v0.2.0 tag.
      - name: BubblePaw-Core revision
        id: core
        working-directory: scratch
        run: |
          rev=$(grep -oE 'BubblePaw-Core\?tag=v0\.2\.0#[0-9a-f]{40}' Cargo.lock | head -1 | cut -d'#' -f2)
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: BubbleBuffer/BubblePaw-Core
          ref: ${{ steps.core.outputs.rev }}
          path: BubblePaw-Core
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: flutter
          workspaces: |
            scratch
            BubblePaw-Core
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The harness loads target/release/libnotes_bridge.so (app/test/harness.dart).
      - name: Build host bridge
        working-directory: scratch
        run: |
          cargo build --release --locked -p notes_bridge
      - name: Build BubblePaw fake extension
        working-directory: BubblePaw-Core
        run: cargo build -p bubblepaw-runner --features test-fixtures --bin bubblepaw-fake-extension
      - name: flutter pub get
        working-directory: scratch/app
        run: |
          # gradle.properties pins a local Android Studio JBR; the runner uses JAVA_HOME.
          sed -i '/^org\.gradle\.java\.home=/d' android/gradle.properties
          flutter pub get
      - name: flutter analyze
        working-directory: scratch/app
        run: flutter analyze
      - name: Add-on import boundaries
        working-directory: scratch
        run: |
          dart scripts/check-addon-imports.dart
          dart scripts/check-addon-imports.dart --self-test
      - name: Generated bindings are fresh
        working-directory: scratch
        run: |
          if ! flutter_rust_bridge_codegen --version 2>/dev/null | grep -q '2\.13\.0'; then
            cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
          fi
          bash scripts/regen-bindings.sh
          git diff --exit-code -- app/rust/src/frb_generated.rs app/lib/src/rust
      - name: flutter test (fast tier, goldens excluded)
        working-directory: scratch/app
        env:
          NOTES_BRIDGE_LIB: ${{ github.workspace }}/scratch/target/release/libnotes_bridge.so
          NOTES_FAKE_EXTENSION: ${{ github.workspace }}/BubblePaw-Core/target/debug/bubblepaw-fake-extension
        run: |
          # Skip golden-named files and any file that compares against a golden image.
          files=()
          while IFS= read -r f; do
            case "$f" in *golden*) echo "skip (golden name): $f"; continue ;; esac
            if grep -q matchesGoldenFile "$f"; then echo "skip (golden image): $f"; continue; fi
            files+=("$f")
          done < <(find test -name '*_test.dart' ! -path 'test/goldens/*' | sort)
          echo "running ${#files[@]} test files"
          jobs=$(( $(nproc) / 2 ))
          [ "$jobs" -lt 1 ] && jobs=1
          flutter test --concurrency="$jobs" -x 'golden || perf || drive' "${files[@]}"
