# CI test gate: every push to any branch of this repository.
#
# Every job runs on build01 (CT 102, runners started by build01-dispatcher).
# GitHub-hosted runners are not used (billing blocked; decided 2026-10-13 to
# keep CI on build01). The runner's persistent _work keeps the Cargo target/
# and the Pub cache warm, sccache wraps rustc, and the Flutter SDK comes from
# the runner's tool cache. The dispatcher caps how many notes-app jobs run at
# once; extra jobs queue.
#
# No pull_request trigger: a PR from a branch of this repository is already
# tested by that branch's push run (same head commit), and a PR from a fork
# must never reach build01, a persistent self-hosted host.
#
# Goldens are not run here: their baselines are rendered on Windows.
name: ci

on:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: rust
    runs-on: [self-hosted, build01]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: notes-app
          clean: false
      # Next to notes-app, so crates/agent's ../../../BubblePaw-base-agent path resolves.
      - uses: actions/checkout@v4
        with:
          repository: BubbleBuffer/BubblePaw-base
          ref: release
          path: BubblePaw-base-agent
          ssh-key: ${{ secrets.BUBBLEPAW_DEPLOY_KEY }}
          persist-credentials: false
          clean: false
      - name: cargo test --workspace
        working-directory: notes-app
        env:
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: sccache
        # notes-tauri (prototypes/tauri) needs the GTK and WebKitGTK dev
        # packages, which build01 does not have. It is a bake-off prototype.
        run: cargo test --workspace --locked --exclude notes-tauri --no-fail-fast

  flutter:
    name: flutter
    runs-on: [self-hosted, build01]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: notes-app
          clean: false
      - uses: actions/checkout@v4
        with:
          repository: BubbleBuffer/BubblePaw-base
          ref: release
          path: BubblePaw-base-agent
          ssh-key: ${{ secrets.BUBBLEPAW_DEPLOY_KEY }}
          persist-credentials: false
          clean: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # build01 keeps the SDK in its persistent tool cache.
          cache: false
      # The harness loads target/release/libnotes_bridge.so (app/test/harness.dart);
      # ai_test.dart runs target/release/examples/fake_agent.
      - name: Build host bridge and test fixtures
        working-directory: notes-app
        env:
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: sccache
        run: |
          cargo build --release -p notes_bridge
          cargo build --release -p vault_mcp --examples
      # The agent tests look for BubblePaw's fake extension in its debug target.
      - name: Build BubblePaw fake extension
        working-directory: BubblePaw-base-agent
        env:
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: sccache
        run: cargo build -p bubblepaw-runner --bin bubblepaw-fake-extension
      - name: flutter pub get
        working-directory: notes-app/app
        run: |
          # gradle.properties pins the PC's Android Studio JBR; build01 uses JAVA_HOME.
          sed -i '/^org\.gradle\.java\.home=/d' android/gradle.properties
          flutter pub get
      - name: flutter analyze
        working-directory: notes-app/app
        run: flutter analyze
      - name: Add-on import boundaries
        working-directory: notes-app
        run: |
          dart scripts/check-addon-imports.dart
          dart scripts/check-addon-imports.dart --self-test
      - name: Generated bindings are fresh
        working-directory: notes-app
        run: |
          if ! flutter_rust_bridge_codegen --version 2>/dev/null | grep -q '2\.13\.0'; then
            cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
          fi
          bash scripts/regen-bindings.sh
          git diff --exit-code -- app/rust/src/frb_generated.rs app/lib/src/rust
      - name: flutter test (fast tier, goldens excluded)
        working-directory: notes-app/app
        env:
          # Same as tool/test.sh: the bridge and fake agent in the shared target/release.
          NOTES_BRIDGE_LIB: ${{ github.workspace }}/notes-app/target/release/libnotes_bridge.so
          NOTES_FAKE_AGENT: ${{ github.workspace }}/notes-app/target/release/examples/fake_agent
        run: |
          # Goldens are rendered on Windows. Skip golden-named files and any file
          # that compares against a golden image. The fast tier also leaves out
          # perf (timing budgets) and drive (a long-lived session host), as
          # tool/test.sh does.
          files=()
          while IFS= read -r f; do
            case "$f" in *golden*) echo "skip (golden name): $f"; continue ;; esac
            if grep -q matchesGoldenFile "$f"; then echo "skip (golden image): $f"; continue; fi
            files+=("$f")
          done < <(find test -name '*_test.dart' ! -path 'test/goldens/*' | sort)
          echo "running ${#files[@]} test files"
          echo "nproc=$(nproc)"
          jobs=$(( $(nproc) / 2 ))
          [ "$jobs" -lt 1 ] && jobs=1
          echo "jobs=$jobs"
          flutter test --concurrency="$jobs" -x 'golden || perf || drive' "${files[@]}"
