# Temporary (removed before merge): runs the rich page golden tests and a
# layout probe on Windows and Linux to find why the mobile ones fail.
name: rich-page-probe

on:
  push:
    branches: [fix/pages-golden-mobile]
    paths: [.github/workflows/rich-page-probe.yml, app/test/rich_page_probe_test.dart, app/test/pages_golden_test.dart]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flutter: 3.47.5
            lib: notes_bridge.dll
          - os: ubuntu-latest
            flutter: 3.47.5
            lib: libnotes_bridge.so
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: probe-${{ matrix.os }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - name: Build host bridge
        run: cargo build --release --locked -p notes_bridge
      - name: Run
        working-directory: app
        env:
          NOTES_BRIDGE_LIB: ${{ github.workspace }}/target/release/${{ matrix.lib }}
        run: |
          flutter --version
          sed -i '/^org\.gradle\.java\.home=/d' android/gradle.properties
          flutter pub get >/dev/null
          flutter test --concurrency=1 test/rich_page_probe_test.dart 2>&1 | grep -E 'PROBE|passed|failed|Error' | head -120 || true
          flutter test --update-goldens --concurrency=1 --plain-name 'rich page' test/pages_golden_test.dart > ../golden.log 2>&1 || true
          grep -n -E 'rich page|EXCEPTION|could not|Found 0|passed|failed' ../golden.log | head -40
          ls screenshots | grep rich || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.os }}-${{ matrix.flutter || 'stable' }}
          path: |
            golden.log
            app/screenshots/*rich-page*.png
