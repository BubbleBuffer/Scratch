# Pre-alpha (and later) releases, built on GitHub-hosted runners.
#
# Push a tag such as v0.1.0-prealpha.1, or run this workflow by hand with an
# existing tag. The version comes from the tag (without the leading v); a tag
# with a pre-release part (anything after "-") becomes a GitHub prerelease.
#
# Assets:
#   Scratch-Setup-<version>.exe            Windows installer (Inno Setup, per user)
#   scratch-<version>-android-arm64.apk    Android app, arm64, pre-alpha key
#                                          (-unsigned.apk without the key secrets)
#   notes-cli-<version>-windows-x64.exe    the notes CLI for Windows
#   notes-cli-<version>-linux-x64.tar.gz   the notes CLI for Linux (glibc)
#   SHA256SUMS.txt
#
# Android versionCode is the build time in epoch minutes, so every release is
# newer than the last one. The app's release key is not on GitHub. The APK here
# is signed with a separate pre-alpha key when the PREALPHA_KEYSTORE_BASE64,
# PREALPHA_KEYSTORE_PASSWORD, PREALPHA_KEY_ALIAS and PREALPHA_KEY_PASSWORD
# secrets are set, and ships unsigned (named ...-unsigned.apk) otherwise. A
# pre-alpha install and a release-signed install cannot update each other.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release, e.g. v0.1.0-prealpha.1
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      numeric: ${{ steps.v.outputs.numeric }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ $TAG =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag '$TAG' is not v<major>.<minor>.<patch>[-<pre-release>]"
            exit 1
          fi
          if [[ $TAG == *-nightly.* ]]; then
            echo "::error::nightly tags are published by nightly.yml, not by this workflow"
            exit 1
          fi
          numeric=${BASH_REMATCH[1]}
          version=${TAG#v}
          prerelease=false
          [[ -n ${BASH_REMATCH[2]} ]] && prerelease=true
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "numeric=$numeric"
            echo "prerelease=$prerelease"
            echo "code=$(( $(date +%s) / 60 ))"
          } >> "$GITHUB_OUTPUT"
          echo "tag $TAG, version $version, prerelease $prerelease"

  windows:
    name: windows app, installer and cli
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.meta.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-windows
          save-if: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      # Bun for the bundled Claude Code (the hub's version, deploy/hub/Dockerfile).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true
      # The app (with its release tag built in for the updater) and the
      # installer; nightly.yml uses the same script.
      - name: Build app and installer
        run: |
          bash scripts/build-windows-installer.sh "${{ needs.meta.outputs.tag }}" "${{ needs.meta.outputs.numeric }}" "${{ needs.meta.outputs.code }}" dist
      - name: Build notes CLI
        run: |
          cargo build --release --locked -p vault_tools --bin notes
          cp target/release/notes.exe "dist/notes-cli-${{ needs.meta.outputs.version }}-windows-x64.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  linux-cli:
    name: linux cli
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.meta.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-linux-cli
          save-if: false
      - name: Build notes CLI
        run: |
          cargo build --release --locked -p vault_tools --bin notes
          mkdir -p dist
          tar -C target/release -czf "dist/notes-cli-${{ needs.meta.outputs.version }}-linux-x64.tar.gz" notes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-cli
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  android:
    name: android apk (arm64)
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.meta.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      # app/android/app/build.gradle.kts reads
      # $LOCALAPPDATA/Notes/android-keystore/keystore.properties.
      - name: Pre-alpha signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.PREALPHA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PREALPHA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PREALPHA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PREALPHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "no pre-alpha key secrets: the APK ships unsigned"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dir="$RUNNER_TEMP/la/Notes/android-keystore"
          install -m 700 -d "$dir"
          ( umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$dir/keystore.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$dir/keystore.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$dir/keystore.properties" )
          echo "LOCALAPPDATA=$RUNNER_TEMP/la" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: flutter build apk --release (arm64)
        working-directory: app
        run: |
          # gradle.properties pins a local Android Studio JBR; the runner uses JAVA_HOME.
          sed -i '/^org\.gradle\.java\.home=/d' android/gradle.properties
          flutter pub get
          flutter build apk --release --target-platform android-arm64 \
            --build-name=${{ needs.meta.outputs.version }} --build-number=${{ needs.meta.outputs.code }}
          mkdir -p ../dist
          name="scratch-${{ needs.meta.outputs.version }}-android-arm64"
          if [ "${{ steps.key.outputs.signed }}" = true ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "../dist/$name.apk"
          else
            # Without the key the build falls back to a throwaway debug key:
            # strip that signature (v1 entries; rewriting the zip drops the
            # v2/v3 signing block) and realign.
            cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/stripped.apk"
            zip -q -d "$RUNNER_TEMP/stripped.apk" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' 'META-INF/MANIFEST.MF' || true
            zipalign=$(ls -d "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)
            "$zipalign" -p -f 4 "$RUNNER_TEMP/stripped.apk" "../dist/$name-unsigned.apk"
          fi
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in ../dist/*.apk; do
            echo "$f:"; "$apksigner" verify --print-certs "$f" 2>&1 | grep -E 'SHA-256 digest|DOES NOT VERIFY|not signed' || true
          done
      - name: Remove the signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/la"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish release
    needs: [meta, windows, linux-cli, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          CODE: ${{ needs.meta.outputs.code }}
          SIGNED: ${{ needs.android.outputs.signed }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if [ "$SIGNED" = true ]; then
            APK_LINE="- Android (arm64): \`scratch-$VERSION-android-arm64.apk\`, versionCode $CODE, signed with the pre-alpha key. It does not update (or get updated by) a release-signed install."
          else
            APK_LINE="- Android (arm64): \`scratch-$VERSION-android-arm64-unsigned.apk\`, versionCode $CODE, unsigned: sign it before installing (no pre-alpha key was configured for this build)."
          fi
          cat > ../notes.md <<EOF
          Scratch $VERSION, built from $TAG on GitHub-hosted runners.

          - Windows: \`Scratch-Setup-$VERSION.exe\` installs per user.
          $APK_LINE
          - CLI: \`notes-cli-$VERSION-windows-x64.exe\` and \`notes-cli-$VERSION-linux-x64.tar.gz\`.

          Checksums are in \`SHA256SUMS.txt\`.
          EOF
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Scratch $VERSION" --notes-file ../notes.md "${flags[@]}" -- *
