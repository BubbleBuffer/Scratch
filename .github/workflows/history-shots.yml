# Temporary: renders the compacted-history goldens and the widget log. Removed before merge.
name: history-shots

on:
  push:
    branches: [feat/compacted-history-ui]
    paths: [.github/workflows/history-shots.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
          persist-credentials: false
      - name: BubblePaw-Core revision
        id: core
        working-directory: head
        run: |
          rev=$(grep -oE 'BubblePaw-Core\?tag=v[0-9.]+#[0-9a-f]{40}' Cargo.lock | head -1 | cut -d'#' -f2)
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: BubbleBuffer/BubblePaw-Core
          ref: ${{ steps.core.outputs.rev }}
          path: BubblePaw-Core
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: flutter
          workspaces: |
            head
            BubblePaw-Core
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build host bridge
        working-directory: head
        run: cargo build --release --locked -p notes_bridge
      - name: Build BubblePaw fake extension
        working-directory: BubblePaw-Core
        run: cargo build -p bubblepaw-runner --features test-fixtures --bin bubblepaw-fake-extension
      - name: Render the compacted goldens
        env:
          NOTES_BRIDGE_LIB: ${{ github.workspace }}/head/target/release/libnotes_bridge.so
          NOTES_FAKE_EXTENSION: ${{ github.workspace }}/BubblePaw-Core/target/debug/bubblepaw-fake-extension
        run: |
          (cd head/app && sed -i '/^org\.gradle\.java\.home=/d' android/gradle.properties && flutter pub get >/dev/null)
          (cd head/app && flutter test --update-goldens --concurrency=1 test/agent_history_golden_test.dart > ../../shots.log 2>&1 || true)
          grep -n "EXCEPTION\|Expected\|Actual\|overflow\|RenderFlex\|The following" shots.log | head -40
          tail -5 shots.log
          ls head/app/test/goldens/compacted
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-shots
          path: |
            shots.log
            head/app/test/goldens/compacted
# rerun
