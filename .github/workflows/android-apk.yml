# Phone APK on the home server (build01 via build01-dispatcher). arm64 only,
# for the Pixel 8 Pro. The runner's persistent _work keeps the cargo target and
# Gradle caches warm between runs. linux01 aligns, release-signs and publishes
# the APK directly; neither the PC nor a GitHub artifact is involved.
name: android-apk

on:
  workflow_dispatch:
  # Every master push that passes CI goes to the phone. Rapid merges collapse:
  # a newer run cancels the older one (concurrency below).
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    # workflow_run fires in this repository's context even when the triggering
    # CI run came from a fork, so require a successful CI push run on this
    # repository's own master before anything reaches build01 and the phone.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, build01]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: notes-app
          clean: false
          # The commit CI passed on, not whatever master is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Next to notes-app, so crates/agent's ../../../BubblePaw-base-agent path resolves.
      - uses: actions/checkout@v4
        with:
          repository: BubbleBuffer/BubblePaw-base
          ref: release
          path: BubblePaw-base-agent
          ssh-key: ${{ secrets.BUBBLEPAW_DEPLOY_KEY }}
          persist-credentials: false
          clean: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false  # build01 keeps the SDK in its persistent tool cache
      - name: Build arm64 release APK
        working-directory: notes-app/app
        env:
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: sccache
        run: |
          # gradle.properties pins the PC's Android Studio JBR; build01 uses JAVA_HOME.
          sed -i '/^org\.gradle\.java\.home=/d' android/gradle.properties
          # Retry once after 60 s: dl.google.com read timeouts are transient.
          for attempt in 1 2; do
            flutter pub get &&
              flutter build apk --release --target-platform android-arm64 \
                --build-number=$(( $(date +%s) / 60 )) && break
            if [ "$attempt" = 2 ]; then
              echo "::error::arm64 release APK build failed on both attempts"
              exit 1
            fi
            echo "Attempt $attempt failed; retrying in 60 s"
            sleep 60
          done
      - name: Sign and publish on linux01
        working-directory: notes-app
        env:
          # Repository variable: the linux01 publish account, user@host.
          APK_PUBLISH_SSH: ${{ vars.APK_PUBLISH_SSH }}
        run: |
          : "${APK_PUBLISH_SSH:?the APK_PUBLISH_SSH repository variable is not set}"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -i /home/builder/.ssh/linux01-apk "$APK_PUBLISH_SSH" 'apk-publish notes' \
            < app/build/app/outputs/flutter-apk/app-release.apk
