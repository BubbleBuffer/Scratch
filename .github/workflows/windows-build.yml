# Windows desktop app, its per-user installer and the `notes` CLI, built on
# GitHub-hosted windows-latest runners. Artifacts only: nothing is released
# or deployed.
#
# Artifacts, kept 7 days:
#   notes-windows-<short sha>      app/build/windows/x64/runner/Release (downloads as a zip)
#   scratch-setup-<short sha>      Scratch-Setup-<version>-<short sha>.exe
#                                  (app/windows/installer/scratch.iss; version from app/pubspec.yaml)
#   notes-cli-windows-<short sha>  notes.exe from crates/tools (package vault_tools, bin notes)
#   scratch-cli-windows            scratch-cli.exe from crates/cli (package scratch_cli), the
#                                  headless AI task runner
#
# windows-latest ships Visual Studio 2022 with the ATL component, which
# flutter_local_notifications_windows needs (atlbase.h).
# Toolchain pins: Flutter 3.47.5 (app/.metadata). Rust is the stable toolchain.
name: windows-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  app:
    name: flutter windows app
    runs-on: windows-latest
    # The Claude Code bundle is ~290 MB of dependencies, which the installer
    # compresses too.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: flutter pub get
        working-directory: app
        run: |
          flutter --version
          flutter pub get
      # The bindings in app/rust/src are committed (ci checks they are fresh).
      # Cargokit builds the bridge crate.
      - name: flutter build windows --release
        working-directory: app
        run: flutter build windows --release
      # The app and scratch-cli find Claude Code as a `claude-code` folder and
      # `bun\bun.exe` beside the executable, so ship both in the Release folder
      # the installer packs. Bun is the hub's version (deploy/hub/Dockerfile).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Bundle Claude Code
        shell: pwsh
        run: ./app/windows/installer/bundle-claude-code.ps1 -ReleaseDir ./app/build/windows/x64/runner/Release
      - name: Short sha for artifact names
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Upload Release folder
        uses: actions/upload-artifact@v4
        with:
          name: notes-windows-${{ steps.sha.outputs.short }}
          path: app/build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 7
      # Inno Setup 6 ships on windows-latest; choco installs it if the image ever drops it.
      - name: Build installer
        id: installer
        working-directory: app
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -x "$iscc" ]; then
            choco install innosetup --no-progress -y
          fi
          version=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          test -n "$version"
          out="$(cygpath -w "$PWD/build/windows/installer")"
          src="$(cygpath -w "$PWD/build/windows/x64/runner/Release")"
          # No MSYS path conversion, so the /Q and /D switches reach ISCC as written.
          MSYS_NO_PATHCONV=1 "$iscc" /Q "/DAppVersion=$version" "/DSha7=${{ steps.sha.outputs.short }}" \
            "/DSourceDir=$src" "/DOutputDir=$out" "$(cygpath -w windows/installer/scratch.iss)"
          ls -l build/windows/installer
          echo "file=build/windows/installer/Scratch-Setup-$version-${{ steps.sha.outputs.short }}.exe" >> "$GITHUB_OUTPUT"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: scratch-setup-${{ steps.sha.outputs.short }}
          path: app/${{ steps.installer.outputs.file }}
          if-no-files-found: error
          retention-days: 7

  cli:
    name: notes cli and scratch-cli (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-cli
      # The workspace target-dir is set in .cargo/config.toml, so the binary lands in target/.
      - name: Build notes CLI and scratch-cli
        run: cargo build --release --locked -p vault_tools --bin notes -p scratch_cli --bin scratch-cli
      - name: Short sha for artifact names
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Upload notes.exe
        uses: actions/upload-artifact@v4
        with:
          name: notes-cli-windows-${{ steps.sha.outputs.short }}
          path: target/release/notes.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload scratch-cli.exe
        uses: actions/upload-artifact@v4
        with:
          name: scratch-cli-windows
          path: target/release/scratch-cli.exe
          if-no-files-found: error
          retention-days: 7
