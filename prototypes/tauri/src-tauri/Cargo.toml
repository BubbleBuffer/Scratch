[package]
name = "notes-tauri"
description = "Tauri half of the UI bake-off: page list and block editor over vault_core."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# Tauri's Android build loads the app as a shared library.
name = "notes_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
vault_core = { path = "../../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
