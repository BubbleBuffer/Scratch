services:
  hub:
    image: notes-hub:latest
    container_name: notes-hub
    restart: unless-stopped
    env_file: .env
    volumes:
      - notes-hub-data:/data
    networks:
      - notes-ingress
    mem_limit: 1g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true

volumes:
  notes-hub-data:
    name: notes-hub-data

networks:
  notes-ingress:
    external: true
