include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - windows/**
    - rust_builder/cargokit/**
    - linux/**

# bb-ui's design-token rules (wiki/app/agent-kit.md). Run `dart analyze` in
# app/ without path arguments: `flutter analyze` and `dart analyze lib test`
# skip analyzer plugins.
plugins:
  bb_lints:
    git:
      url: https://github.com/BubbleBuffer/bb-ui
      ref: 7c92a358a57656271ff8174ecef41d4a49dc0794
      path: packages/bb_lints
