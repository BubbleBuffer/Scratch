org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# No JDK pin here: Gradle uses JAVA_HOME. A machine whose default Java is too new
# for this Gradle sets org.gradle.java.home in its own ~/.gradle/gradle.properties.
# Ride out short network hiccups (read timeouts) while fetching Android artifacts from
# dl.google.com on the self-hosted CI runner: longer HTTP timeouts and more retries with a longer backoff.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
# The self-hosted CI runner has no working IPv6 route to dl.google.com (connect fails at once) while IPv4 works,
# so force Java onto IPv4 to avoid Maven/Google read timeouts.
systemProp.java.net.preferIPv4Stack=true
