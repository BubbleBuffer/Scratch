name: notes_app
description: "Scratch: a notes app over the Rust vault core. Flutter without Material."
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.13.4

dependencies:
  app_links: 7.2.2
  # UI tokens and primitives from bb-ui (wiki/architecture/agent-kit.md).
  # bb_tokens comes with bb_ui; don't declare it here.
  bb_ui:
    git:
      url: https://github.com/BubbleBuffer/bb-ui
      ref: v0.6.0
      path: packages/bb_ui
  device_info_plus: ^13.3.0
  file_picker: ^13.1.0
  lucide_icons_flutter: 3.1.25
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_local_notifications: ^22.3.1
  package_info_plus: ^10.2.2
  sensors_plus: ^7.1.1
  timezone: ^0.11.1
  url_launcher: 6.3.3
  notes_bridge:
    path: rust_builder
  # The shared agent kit, pinned to the commit of kit tag v0.8.0:
  # agent_kit_core remains a path dependency of agent_kit, so both direct
  # refs must be the same full commit SHA. The chat's outline and the dev pane use them.
  agent_kit:
    git:
      url: https://github.com/BubbleBuffer/agent-kit.git
      ref: ea36cc27aee66808e30db0c51cae3ade7b81e410
      path: packages/agent_kit
  agent_kit_core:
    git:
      url: https://github.com/BubbleBuffer/agent-kit.git
      ref: ea36cc27aee66808e30db0c51cae3ade7b81e410
      path: packages/agent_kit_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/fonts/licenses/
    - assets/icons/app_icon_64.png
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque[opsz,wdth,wght].ttf
    - family: Atkinson Hyperlegible Next
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext[wght].ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Italic[wght].ttf
          style: italic
    - family: Fragment Mono
      fonts:
        - asset: assets/fonts/FragmentMono-Regular.ttf
        - asset: assets/fonts/FragmentMono-Italic.ttf
          style: italic
