[package]
name = "vault_agent"
description = "A BubblePaw agent over a notes vault: vault tools in js, sessions, providers, approvals, live events and AI tasks."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "vault_agent"

[dependencies]
vault_core = { path = "../core" }
vault_tools = { path = "../tools" }
vault_mcp = { path = "../mcp" }
notes_agent_wire = { path = "../agent_wire" }
# Interim: path dependencies into the BubblePaw worktree (branch
# agent-integration, merged into release) until it becomes a git dependency.
# scripts/publish-public.sh rewrites these to BubbleBuffer/BubblePaw-Core
# for the public Scratch copy.
# The runner's `web` feature stays off.
bubblepaw-core = { git = "https://github.com/BubbleBuffer/BubblePaw-Core", rev = "2cddf0cd165043d2984a975b2e94932b5a9d325f" }
bubblepaw-runner = { git = "https://github.com/BubbleBuffer/BubblePaw-Core", rev = "2cddf0cd165043d2984a975b2e94932b5a9d325f" }
anyhow = "1"
async-trait = "0.1"
futures-core = "0.3"
serde = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
# Bundle tzdb on every target, including Android (platform defaults use its system db).
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
rusqlite = { version = "0.40", features = ["bundled"] }
similar = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
