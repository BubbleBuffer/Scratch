[package]
name = "vault_tools"
description = "Transport-independent tools for notes-app vaults."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "vault_tools"

[[bin]]
name = "import-replay"
path = "src/bin/import-replay.rs"

[[bin]]
name = "notes"
path = "src/bin/notes.rs"

[dependencies]
vault_core = { path = "../core" }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
toml = "0.8"
serde_yaml = "0.9"
# Pinned: attach_file uses ureq's unversioned resolver API (no semver guarantee).
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
url = "2"
base64 = "0.22"
tar = "0.4"
tempfile = "3"
# BubblePaw's core crate at tag v0.2.2 (the same tag as crates/agent); the
# import CLI creates sessions through its Store. Not the SDK: that pulls in the
# runner and QuickJS, which don't build for Android, and this crate builds there.
bubblepaw-core = { git = "https://github.com/BubbleBuffer/BubblePaw-Core", tag = "v0.2.2" }

[dev-dependencies]
notes_hub = { path = "../hub" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
