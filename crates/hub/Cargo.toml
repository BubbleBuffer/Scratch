[package]
name = "notes_hub"
description = "notes-hub: the vault hub for a server, sync over axum with device tokens from an OIDC login."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "notes_hub"

[[bin]]
name = "notes-hub"
path = "src/main.rs"

[dependencies]
vault_core = { path = "../core" }
vault_sync = { path = "../sync" }
vault_mcp = { path = "../mcp" }
vault_tools = { path = "../tools" }
vault_agent = { path = "../agent" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json", "form", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "io-util", "rt"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.8"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
getrandom = "0.3"

[dev-dependencies]
tar = "0.4"
notes_agent_wire = { path = "../agent_wire" }
tokio-tungstenite = { version = "0.29", features = ["connect"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = "0.9"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
sha2 = "0.10"
