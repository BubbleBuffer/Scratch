[package]
name = "vault_mcp"
description = "MCP server for notes-app vaults (stdio), AI tasks and the desktop agent runner."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "vault_mcp"

[[bin]]
name = "notes-mcp"
path = "src/bin/notes-mcp.rs"

[dependencies]
vault_core = { path = "../core" }
vault_tools = { path = "../tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
